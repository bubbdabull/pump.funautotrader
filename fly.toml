# Fly.io API — deploy from repo root (uses ./Dockerfile)
# https://fly.io/docs/reference/configuration/

app = 'pump-funautotrader'
primary_region = 'dfw'

[build]
  dockerfile = 'Dockerfile'

[env]
  NODE_ENV = 'production'
  PORT = '8080'
  HOST = '0.0.0.0'
  PHRONIS_PROCESS_ROLE = 'api'
  USE_SUPABASE_REST_DB = 'true'
  DATABASE_OPTIONAL = 'true'
  # Prisma client expects DATABASE_URL even when using Supabase REST only
  DATABASE_URL = 'postgresql://noop:noop@127.0.0.1:5432/noop'
  PUMP_FUN_API_URL = 'https://frontend-api.pump.fun'
  PUMPPORTAL_WS_URL = 'wss://pumpportal.fun/api/data'
  PUMPPORTAL_TRADE_URL = 'https://pumpportal.fun/api/trade-local'
  PUMPPORTAL_TRADE_SUB_ROTATE_MS = '20000'
  # BullMQ blocks HTTP bind if Redis is slow — realtime uses PumpPortal WS + PersistenceQueue
  BULL_DISABLED = 'true'
  # Set REDIS_URL (Upstash) via fly secrets — enables snapshots + optional persist worker fan-out
  # REDIS_DISABLED = 'false' when REDIS_URL is set

[processes]
  app = 'node dist/main.js'
  persist = 'PHRONIS_PROCESS_ROLE=persist node dist/main.js'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    grace_period = '60s'
    interval = '20s'
    method = 'GET'
    path = '/api/health'
    timeout = '15s'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1

# Optional second process group for async Supabase drain (scale with: fly scale count persist=1)
# Requires REDIS_URL — api publishes jobs, persist worker consumes phronis:persist:jobs
