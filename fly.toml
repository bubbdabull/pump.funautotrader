# Fly.io API — deploy from repo root (uses ./Dockerfile)
# https://fly.io/docs/reference/configuration/

app = 'pump-funautotrader'
primary_region = 'dfw'

[build]
  dockerfile = 'Dockerfile'

[env]
  NODE_ENV = 'production'
  PORT = '8080'
  HOST = '0.0.0.0'
  REDIS_DISABLED = 'true'
  USE_SUPABASE_REST_DB = 'true'
  DATABASE_OPTIONAL = 'true'
  # Prisma client expects DATABASE_URL even when using Supabase REST only
  DATABASE_URL = 'postgresql://noop:noop@127.0.0.1:5432/noop'
  PUMP_FUN_API_URL = 'https://frontend-api.pump.fun'
  PUMP_FUN_BOOTSTRAP_LIMIT = '100'
  PUMP_FUN_SYNC_INTERVAL_MS = '120000'
  LIVE_FEED_MAX = '300'
  PUMPPORTAL_WS_URL = 'wss://pumpportal.fun/api/data'
  PUMPPORTAL_TRADE_URL = 'https://pumpportal.fun/api/trade-local'
  PUMPPORTAL_MAX_TRADE_SUBS = '250'
  PUMPPORTAL_TRADE_SUB_BATCH = '80'
  PUMPPORTAL_TRADE_SUB_ROTATE_MS = '45000'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    grace_period = '90s'
    interval = '15s'
    method = 'GET'
    path = '/api/health'
    timeout = '10s'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
