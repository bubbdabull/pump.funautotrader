# Fly.io API — deploy from repo root (uses ./Dockerfile)
# Docs: https://fly.io/docs/reference/configuration/

app = 'pumpfunautotrader-api'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  NODE_ENV = 'production'
  PORT = '8080'
  HOST = '0.0.0.0'
  REDIS_DISABLED = 'true'
  USE_SUPABASE_REST_DB = 'true'
  PUMP_FUN_API_URL = 'https://frontend-api.pump.fun'
  PUMPPORTAL_WS_URL = 'wss://pumpportal.fun/api/data'
  PUMPPORTAL_TRADE_URL = 'https://pumpportal.fun/api/trade-local'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    grace_period = '20s'
    interval = '30s'
    method = 'GET'
    path = '/api/health'
    timeout = '5s'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
