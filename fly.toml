# Fly.io API — deploy from repo root: fly deploy -a pump-funautotrader
# Do NOT deploy with --image deployment-... (skips fresh build).
# Do NOT set fly secrets PORT or PHRONIS_PROCESS_ROLE (use fly.toml + process groups).

app = 'pump-funautotrader'
primary_region = 'dfw'

[build]
  dockerfile = 'Dockerfile'

[env]
  NODE_ENV = 'production'
  PORT = '8080'
  HOST = '0.0.0.0'
  PHRONIS_PROCESS_ROLE = 'api'
  USE_SUPABASE_REST_DB = 'true'
  DATABASE_OPTIONAL = 'true'
  DATABASE_URL = 'postgresql://noop:noop@127.0.0.1:5432/noop'
  PUMP_FUN_API_URL = 'https://frontend-api.pump.fun'
  PUMPPORTAL_WS_URL = 'wss://pumpportal.fun/api/data'
  PUMPPORTAL_TRADE_URL = 'https://pumpportal.fun/api/trade-local'
  PUMPPORTAL_TRADE_SUB_ROTATE_MS = '20000'
  PUMPPORTAL_CONNECT_DEFER_MS = '12000'
  PUMP_FEED_SYNC_DEFER_MS = '90000'
  INGESTION_SINGLE_LEADER = 'true'
  BULL_DISABLED = 'true'

[processes]
  app = 'node dist/main.js'
  persist = 'PHRONIS_PROCESS_ROLE=persist node dist/main.js'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    grace_period = '120s'
    interval = '15s'
    method = 'GET'
    path = '/api/health'
    timeout = '20s'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1

# After first healthy deploy: fly scale count app=1 persist=0 -a pump-funautotrader
# Persist workers have no HTTP listener — only scale persist=1 when you need async drain.
