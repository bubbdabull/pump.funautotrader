# Render — https://render.com (free tier sleeps; $7/mo for always-on)
# Dashboard: New → Blueprint → connect repo (uses this file)

services:
  - type: web
    name: pumpfunautotrader-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 8080
      - key: REDIS_DISABLED
        value: true
      - key: USE_SUPABASE_REST_DB
        value: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: PUMPPORTAL_API_KEY
        sync: false
      - key: PUMPPORTAL_WS_URL
        value: wss://pumpportal.fun/api/data
      - key: PUMP_FUN_API_URL
        value: https://frontend-api.pump.fun
      - key: PUMPPORTAL_TRADE_URL
        value: https://pumpportal.fun/api/trade-local
